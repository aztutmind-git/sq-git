<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password — SyllabusQuest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#171335; --paper:#FBF7EC; --paper-line:#E7DFC9; --gold:#F0B429; --gold-dark:#C98A0A; --danger:#E15554; --success:#2FAE6A; }
  *{box-sizing:border-box;}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--ink);margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:var(--paper);max-width:380px;width:100%;border-radius:20px;padding:28px 24px;box-shadow:0 20px 45px rgba(0,0,0,0.35);}
  h1{font-family:'Fredoka';font-size:20px;margin:0 0 6px;color:var(--ink);}
  p{color:#665f8f;font-size:13.5px;line-height:1.5;margin:0 0 18px;}
  label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#948c68;margin-bottom:6px;}
  input{width:100%;padding:12px 13px;border-radius:11px;border:1.5px solid var(--paper-line);font-size:14.5px;margin-bottom:14px;outline:none;}
  input:focus{border-color:var(--gold);}
  button{width:100%;padding:14px;border-radius:13px;background:linear-gradient(180deg,#2a2260,var(--ink));color:#fff;font-weight:700;font-size:15px;border:none;cursor:pointer;}
  .msg{font-size:13px;margin-top:14px;text-align:center;}
  .msg.ok{color:var(--success);}
  .msg.err{color:var(--danger);}
</style>
<script>window.SQ_API_BASE = 'https://sq-git.onrender.com';</script>
</head>
<body>
  <div class="card">
    <h1>Set a new password</h1>
    <p id="intro">Choose a new password for your account.</p>
    <div id="form-wrap">
      <label>New password</label>
      <input id="new-password" type="password" placeholder="At least 6 characters">
      <button onclick="submitReset()">Reset password</button>
    </div>
    <div id="message" class="msg"></div>
  </div>

<script>
  // Point this at your FastAPI backend
  const API_BASE = window.SQ_API_BASE || 'http://localhost:8000';

  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  if(!token){
    document.getElementById('form-wrap').style.display = 'none';
    document.getElementById('message').textContent = 'This reset link is missing its token. Please request a new one from the app.';
    document.getElementById('message').className = 'msg err';
  }

  async function submitReset(){
    const newPassword = document.getElementById('new-password').value;
    const msgEl = document.getElementById('message');
    if(!newPassword || newPassword.length < 6){
      msgEl.textContent = 'Password must be at least 6 characters.';
      msgEl.className = 'msg err';
      return;
    }
    try{
      const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({token, new_password: newPassword}),
      });
      const data = await res.json();
      if(!res.ok){ throw new Error(data.detail || 'Could not reset password'); }
      document.getElementById('form-wrap').style.display = 'none';
      msgEl.textContent = data.message || 'Password updated. You can now log in.';
      msgEl.className = 'msg ok';
    }catch(err){
      msgEl.textContent = err.message;
      msgEl.className = 'msg err';
    }
  }
</script>
</body>
</html>
